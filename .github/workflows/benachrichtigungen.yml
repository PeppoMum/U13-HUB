# Verschickt die Benachrichtigungen der U13-App alle 5 Minuten (GitHub startet oft etwas später).
# Gehört bei GitHub nach .github/workflows/benachrichtigungen.yml. Geheimnisse: HELFER_PASSWORT und VAPID_PRIVAT.
name: Benachrichtigungen
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: benachrichtigungen
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  senden:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-audit --no-fund web-push@3.6.7
        working-directory: push
      - run: node push/senden.mjs
        env:
          HELFER_PASSWORT: ${{ secrets.HELFER_PASSWORT }}
          VAPID_PRIVAT: ${{ secrets.VAPID_PRIVAT }}
